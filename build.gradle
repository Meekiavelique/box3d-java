plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.meekdev'
version = project.version

repositories {
    mavenCentral()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets.main.java.srcDir 'src/generated/java'

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'bkun.box3d.library', findProperty('box3dLib')
            ?: "${projectDir}/natives/${nativePlatform()}/${sharedLibrary('box3d')}"
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// <os>-<arch>, the same id Bkun and Gravimity use to find the natives they load
def nativePlatform() {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    def name = os.contains('win') ? 'windows' : os.contains('mac') ? 'macos' : 'linux'
    def bits = arch.contains('aarch64') || arch.contains('arm') ? 'arm64' : 'x64'
    return "$name-$bits"
}

def windows() {
    return System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('win')
}

def sharedLibrary(String stem) {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (os.contains('win')) {
        return "${stem}.dll".toString()
    }
    return (os.contains('mac') ? "lib${stem}.dylib" : "lib${stem}.so").toString()
}

// where cmake drops the library depends on the generator - bin/, bin/Release/, or the build root -
// and on Linux the plain name is a symlink into libbox3d.so.0.1.0, so search then resolve the link
def builtLibrary(File root, String stem) {
    // cmake keeps the lib prefix on windows too, so box3d.dll is written as libbox3d.dll, but
    // NativeLoader asks for System.mapLibraryName which has no prefix there - accept both
    def names = [sharedLibrary(stem)]
    if (windows()) {
        names << "lib${stem}.dll".toString()
    }
    def found = null
    if (root.isDirectory()) {
        root.eachFileRecurse { candidate ->
            if (found == null && names.contains(candidate.name) && candidate.isFile()) {
                found = candidate.canonicalFile
            }
        }
    }
    if (found == null) {
        throw new GradleException("cmake did not produce any of $names under $root")
    }
    return found
}

// Ninja when it is on PATH because it is much faster, otherwise whatever cmake picks for the
// platform, which is what makes this work on a Windows runner with no ninja installed
def cmakeGenerator() {
    def override = findProperty('cmakeGenerator') ?: System.getenv('CMAKE_GENERATOR')
    if (override) {
        return override == 'default' ? null : override
    }
    def executable = windows() ? 'ninja.exe' : 'ninja'
    def onPath = (System.getenv('PATH') ?: '').split(File.pathSeparator).any { entry ->
        entry && new File(entry, executable).canExecute()
    }
    return onPath ? 'Ninja' : null
}

def configureCommand(List<String> extra) {
    def command = ['cmake', '-B', 'build']
    def generator = cmakeGenerator()
    if (generator) {
        command += ['-G', generator]
    }
    return command + extra
}

def jextract() {
    def configured = findProperty('jextract') ?: System.getenv('JEXTRACT')
    if (configured) {
        return configured.toString()
    }
    def home = System.getProperty('user.home')
    return windows()
            ? "$home/.local/jextract-25/bin/jextract.bat"
            : "$home/.local/jextract-25/bin/jextract"
}

def nativeDir = layout.projectDirectory.dir('native/box3d')
def nativeOut = layout.projectDirectory.dir("natives/${nativePlatform()}")

// native/box3d is a submodule, so anything left sitting in it is one git clean from gone. ours live
// in native/rollback and get copied in before cmake runs.
tasks.register('graftRollbackSources') {
    def sourceDir = file('native/rollback')
    def targetDir = file(nativeDir)
    inputs.dir sourceDir
    outputs.files "${nativeDir}/src/rollback.c", "${nativeDir}/include/box3d/box3d_rollback.h"
    doLast {
        // include and src only, copying the lot drops our readme on top of upstream's
        copy {
            from "${sourceDir}/include"
            into "${targetDir}/include"
        }
        copy {
            from "${sourceDir}/src"
            into "${targetDir}/src"
        }
        def listing = file("${nativeDir}/src/CMakeLists.txt")
        def text = listing.text
        if (!text.contains('rollback.c')) {
            listing.text = text.replace('\tcontact.c\n', '\tcontact.c\n\trollback.c\n')
            logger.lifecycle('[box3d] added rollback.c to the box3d source listing')
        }
    }
}

tasks.register('configureNative', Exec) {
    dependsOn 'graftRollbackSources'
    workingDir nativeDir
    commandLine configureCommand([
            '-DCMAKE_BUILD_TYPE=Release', '-DBUILD_SHARED_LIBS=ON',
            '-DBOX3D_DOUBLE_PRECISION=ON', '-DBOX3D_SAMPLES=OFF', '-DBOX3D_UNIT_TESTS=OFF'])
}

tasks.register('configureVhacd', Exec) {
    workingDir 'native/vhacd'
    commandLine configureCommand(['-DCMAKE_BUILD_TYPE=Release'])
}

tasks.register('buildVhacd', Exec) {
    dependsOn 'configureVhacd'
    workingDir 'native/vhacd'
    commandLine 'cmake', '--build', 'build', '--config', 'Release'
    doLast {
        def library = builtLibrary(file('native/vhacd/build'), 'bkunvhacd')
        copy {
            from library
            into nativeOut
            rename { sharedLibrary('bkunvhacd') }
        }
    }
}

tasks.register('regenerateVhacdBindings', Exec) {
    workingDir projectDir
    commandLine jextract(),
            '--output', 'src/generated/java',
            '--target-package', 'com.meekdev.box3d.ffi.vhacd',
            '-I', 'native/vhacd',
            'native/vhacd/vhacd_wrapper.h'
}

tasks.register('buildNative', Exec) {
    dependsOn 'configureNative'
    workingDir nativeDir
    commandLine 'cmake', '--build', 'build', '--target', 'box3d', '--config', 'Release'
    doLast {
        def library = builtLibrary(file("${nativeDir}/build"), 'box3d')
        copy {
            from library
            into nativeOut
            rename { sharedLibrary('box3d') }
        }
    }
}

// own header, own jextract run, own package, so an upstream sync can't conflict with it
tasks.register('regenerateRollbackBindings', Exec) {
    dependsOn 'graftRollbackSources'
    workingDir projectDir
    commandLine jextract(),
            '--output', 'src/generated/java',
            '--target-package', 'com.meekdev.box3d.ffi.rollback',
            '-DBOX3D_DOUBLE_PRECISION',
            '-I', 'native/box3d/include',
            'native/box3d/include/box3d/box3d_rollback.h'
}

tasks.register('regenerateBindings', Exec) {
    workingDir projectDir
    commandLine jextract(),
            '--output', 'src/generated/java',
            '--target-package', 'com.meekdev.box3d.ffi',
            '-DBOX3D_DOUBLE_PRECISION',
            '-I', 'native/box3d/include',
            'native/box3d/include/box3d/box3d.h'
}

// ship whatever natives have been built so the loader can pull them off the classpath
jar {
    from('natives') {
        into 'natives'
    }
}
